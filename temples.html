<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Temple picture album for the WDD 131 W02 assignment.">
    <meta name="author" content="Muwonge Richard">
    <title>Temple Picture Album | WDD 131</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="header-row">
            <span id="course-title">Temple Album</span>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <nav id="site-nav" class="site-nav" aria-label="Temple filters">
            <a class="filter-link active" href="#temple-gallery" data-filter="home" aria-current="page">Home</a>
            <a class="filter-link" href="#temple-gallery" data-filter="old">Old</a>
            <a class="filter-link" href="#temple-gallery" data-filter="new">New</a>
            <a class="filter-link" href="#temple-gallery" data-filter="large">Large</a>
            <a class="filter-link" href="#temple-gallery" data-filter="small">Small</a>
        </nav>
    </header>

    <main class="temple-page">
        <section class="page-intro" aria-labelledby="album-heading">
            <div>
                <p class="eyebrow">W02 Assignment</p>
                <h1 id="album-heading">Temple Pictures</h1>
                <p>Explore a gallery of beautiful temples from around the world. Use the filters below to sort the album by time, size, or collection.</p>
            </div>
        </section>

        <section id="temple-gallery" class="temple-gallery" aria-live="polite">
            <figure class="temple-figure" data-era="old" data-size="large">
                <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=700&q=80" alt="Salt Lake Temple with tall spires and a historic stone exterior." />
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure class="temple-figure" data-era="old" data-size="large">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80" alt="Manti Temple set against a mountain backdrop in Utah." />
                <figcaption>Manti Temple</figcaption>
            </figure>

            <figure class="temple-figure" data-era="new" data-size="small">
                <img src="https://images.unsplash.com/photo-1521295121783-8a321d551ad2?auto=format&fit=crop&w=700&q=80" alt="Nauvoo Temple with a soft evening glow and classic architecture." />
                <figcaption>Nauvoo Temple</figcaption>
            </figure>

            <figure class="temple-figure" data-era="new" data-size="large">
                <img src="https://images.unsplash.com/photo-1507692049790-de58290a4334?auto=format&fit=crop&w=700&q=80" alt="Rome Italy Temple facade framed by Italian city scenery." />
                <figcaption>Rome Italy Temple</figcaption>
            </figure>

            <figure class="temple-figure" data-era="old" data-size="small">
                <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=700&q=80" alt="Tokyo Japan Temple in a tranquil setting with gardens and stone architecture." />
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>

            <figure class="temple-figure" data-era="new" data-size="small">
                <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=700&q=80" alt="Freiberg Germany Temple amid a modern European neighborhood." />
                <figcaption>Freiberg Germany Temple</figcaption>
            </figure>

            <figure class="temple-figure" data-era="old" data-size="large">
                <img src="https://images.unsplash.com/photo-1448630360428-65456885c650?auto=format&fit=crop&w=700&q=80" alt="Jordan River Temple with a clean modern design and landscaped grounds." />
                <figcaption>Jordan River Temple</figcaption>
            </figure>

            <figure class="temple-figure" data-era="old" data-size="small">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=80" alt="Provo Temple standing in a quiet Utah valley landscape." />
                <figcaption>Provo Temple</figcaption>
            </figure>

            <figure class="temple-figure" data-era="new" data-size="medium">
                <img src="https://images.unsplash.com/photo-1467269204594-9661b134dd2b?auto=format&fit=crop&w=700&q=80" alt="Winnipeg Manitoba Temple seen on a bright morning with a welcoming facade." />
                <figcaption>Winnipeg Manitoba Temple</figcaption>
            </figure>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="currentyear"></span> Muwonge Richard | Temple Picture Album</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
