<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thank you for sharing your product feedback. View your WDD 131 review submission total.">
  <meta name="author" content="Richard Muwonge Ssemaganda">
  <meta name="theme-color" content="#102744">
  <title>Review Confirmation | WDD 131</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/review.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to confirmation</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-brand" href="form.html">WDD 131 <span>Product Reviews</span></a>
      <p class="course-label">Week 05 assignment</p>
    </div>
  </header>

  <main id="main-content" class="page-main confirmation-main">
    <section class="confirmation-card" aria-labelledby="confirmation-title">
      <div class="success-icon" aria-hidden="true">✓</div>
      <p class="eyebrow">Thank you</p>
      <h1 id="confirmation-title">Review submitted successfully!</h1>
      <p id="confirmation-message">Thank you for submitting a product review. Your feedback is appreciated.</p>
      <div class="review-total">
        <span class="review-total-number" id="review-count" aria-live="polite">0</span>
        <span>reviews completed</span>
      </div>
      <a class="submit-button another-review" href="form.html">Submit another review <span aria-hidden="true">→</span></a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© <span id="current-year">2026</span> Richard Muwonge Ssemaganda</p>
      <p>WDD 131 · Product Review Form</p>
    </div>
  </footer>
</body>
</html>
